# Checkov findings accepted on purpose. Each is explained in docs/AWS_DEPLOYMENT.md ("Security scan").
framework: [terraform]
quiet: true
compact: true
skip-check:
  - CKV_AWS_333   # tasks get public IPs for outbound access instead of a NAT gateway (~$35/month); ingress is load balancer only
  - CKV_AWS_260   # port 80 stays open only to redirect to https://humanitylabs.in
  - CKV_AWS_2     # the forwarding HTTP listener exists only when no domain is set (production sets humanitylabs.in); Checkov cannot see that value
  - CKV_AWS_378   # TLS ends at the load balancer; it reaches the tasks over HTTP inside the VPC, on the app security group only
  - CKV_AWS_103   # flags the no-domain HTTP listener; the HTTPS listener uses ELBSecurityPolicy-TLS13-1-2-2021-06
  - CKV2_AWS_20   # HTTP does redirect to HTTPS whenever the domain is set; Checkov evaluates the no-domain fallback
  - CKV2_AWS_31   # WAF request logs are off (CloudWatch cost); WAF metrics and sampled requests are on
  - CKV2_AWS_76   # Log4j is blocked by KnownBadInputs; the anonymous-IP list this check also wants would block VPN users and API clients on cloud hosts
  - CKV_AWS_91    # load balancer access logs are optional (S3 cost)
  - CKV_AWS_150   # the app layer is disposable by design; the database has deletion protection
  - CKV_AWS_157   # Multi-AZ doubles database cost; variable db_multi_az turns it on
  - CKV_AWS_118   # enhanced monitoring adds CloudWatch cost
  - CKV_AWS_353   # Performance Insights: optional
  - CKV_AWS_65    # Container Insights adds CloudWatch cost
  - CKV_AWS_149   # secrets use the AWS-managed key; a customer key costs $1/month each
  - CKV_AWS_158   # logs: AWS-managed encryption
  - CKV_AWS_136   # ECR: AES-256 encryption
  - CKV_AWS_145   # state and Community photo buckets: SSE-S3 encryption
  - CKV2_AWS_57   # rotating the database password needs a coordinated app restart; documented as a manual step
  - CKV_AWS_338   # logs are kept 30 days to limit cost
  - CKV2_AWS_11   # VPC flow logs are optional (CloudWatch cost)
  - CKV_AWS_18    # state and photo bucket access logging: optional (photos are served through the app, which logs access)
  - CKV_AWS_144   # state and photo bucket cross-region replication: optional
  - CKV2_AWS_62   # state and photo bucket event notifications: not needed (the worker polls the database)
  - CKV_AWS_394   # two zones are picked from the region's available zones at creation time
  - CKV_AWS_26    # alert topic carries alarm names only; CloudWatch cannot publish to a topic encrypted with the AWS-managed SNS key
  - CKV2_AWS_5    # the app security group is attached by the app stack (separate state)
  - CKV_AWS_107   # deploy role manages the whole stack; it is usable only from approved runs of this repository
  - CKV_AWS_108   # same
  - CKV_AWS_109   # same
  - CKV_AWS_111   # same
  - CKV_AWS_356   # same
