# Updates and reprovisioning: deploys every commit on main that passes CI, and can be run by hand.
# Infrastructure changes in infra/terraform are planned and applied in the same run; a plan that would delete or
# replace the database, a secret or the image repository stops unless allow_data_deletion is ticked.
# Nothing runs until AWS is set up (the AWS_DEPLOY_ROLE_ARN variable exists), and every run waits for approval
# in the "production" environment.
name: AWS deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_data_deletion:
        description: Allow a plan that deletes or replaces the database, a secret or the image repository
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    uses: ./.github/workflows/aws-deploy-core.yml
    with:
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      allow_data_deletion: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_data_deletion || false }}
