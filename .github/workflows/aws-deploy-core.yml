# Shared deployment steps, called by aws-provision.yml and aws-deploy.yml.
# Runs in the protected "production" environment, so a reviewer must approve before anything changes in AWS.
name: AWS deploy (shared steps)

on:
  workflow_call:
    inputs:
      ref:
        description: Git commit to deploy
        type: string
        required: true
      seed:
        description: Load the hand-checked Indian alerts after migrating (safe to repeat)
        type: boolean
        default: false
      restore_snapshot:
        description: Create the database from this snapshot if it does not exist yet
        type: string
        default: ""
      allow_data_deletion:
        description: Let a plan delete or replace the database, secrets or image repository
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: ${{ vars.PROJECT || 'humanity-labs' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_project: ${{ vars.PROJECT || 'humanity-labs' }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_db_identifier: ${{ vars.DB_IDENTIFIER }}
  # Production domain, registered in Route 53 in the same account (platform/domain.tf). Set DOMAIN_NAME to override.
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || 'humanitylabs.in' }}
  TF_VAR_email_backend: ${{ vars.EMAIL_BACKEND || 'console' }}
  TF_VAR_email_from: ${{ vars.EMAIL_FROM || 'Humanity Labs <alerts@humanitylabs.in>' }}
  TF_VAR_smtp_host: ${{ vars.SMTP_HOST }}
  TF_VAR_smtp_username: ${{ vars.SMTP_USERNAME }}
  # ARM64 (Graviton) is the default; set the repository variable CPU_ARCHITECTURE=X86_64 to switch back.
  CPU_ARCHITECTURE: ${{ vars.CPU_ARCHITECTURE || 'ARM64' }}
  TF_VAR_cpu_architecture: ${{ vars.CPU_ARCHITECTURE || 'ARM64' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Check repository variables
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then echo "::error::Set the repository variable AWS_DEPLOY_ROLE_ARN (see docs/AWS_DEPLOYMENT.md)"; exit 1; fi
          if [ -z "$TF_STATE_BUCKET" ]; then echo "::error::Set the repository variable TF_STATE_BUCKET (see docs/AWS_DEPLOYMENT.md)"; exit 1; fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # ------------------------------------------------------------ persistent layer (network, database, secrets)
      - name: Plan platform
        working-directory: infra/terraform/platform
        env:
          RESTORE_SNAPSHOT: ${{ inputs.restore_snapshot }}
        run: |
          terraform init -backend-config="bucket=${TF_VAR_state_bucket}" -backend-config="region=${AWS_REGION}"
          if [ -n "${RESTORE_SNAPSHOT}" ]; then
            export TF_VAR_restore_snapshot_identifier="${RESTORE_SNAPSHOT}"
            echo "Creating the database from snapshot ${RESTORE_SNAPSHOT} if it does not exist yet"
          fi
          terraform plan -out=platform.tfplan
          terraform show -json platform.tfplan > platform.json

      - name: Guard against data loss
        env:
          ALLOW_DATA_DELETION: ${{ inputs.allow_data_deletion }}
        run: python3 infra/scripts/plan_guard.py < infra/terraform/platform/platform.json

      - name: Apply platform
        working-directory: infra/terraform/platform
        run: |
          terraform apply platform.tfplan
          terraform output -json > ../platform-outputs.json

      - name: Read platform outputs
        id: platform
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          out = json.load(open("infra/terraform/platform-outputs.json"))
          for key in ("ecr_repository_url", "ecr_repository_name", "log_group_name", "db_identifier"):
              print(f"{key}={out[key]['value']}")
          PY

      # ------------------------------------------------------------ container image
      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up ARM64 emulation for the image build
        if: env.CPU_ARCHITECTURE == 'ARM64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Build and push the image (skipped if this commit is already built)
        id: image
        env:
          REPO_URL: ${{ steps.platform.outputs.ecr_repository_url }}
          REPO_NAME: ${{ steps.platform.outputs.ecr_repository_name }}
          REF: ${{ inputs.ref }}
        run: |
          # The tag names the architecture: tags are immutable, so switching CPU_ARCHITECTURE must not reuse an image
          # built for the other one.
          if [ "$CPU_ARCHITECTURE" = "ARM64" ]; then PLATFORM=linux/arm64; else PLATFORM=linux/amd64; fi
          TAG="${REF}-${PLATFORM#linux/}"
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already in ECR"
          else
            docker build --platform "$PLATFORM" -t "$REPO_URL:$TAG" .
            docker push "$REPO_URL:$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------ app layer, migrations first
      - name: Prepare app stack and the one-off task definition
        working-directory: infra/terraform/app
        env:
          TF_VAR_image_tag: ${{ steps.image.outputs.tag }}
        run: |
          terraform init -backend-config="bucket=${TF_VAR_state_bucket}" -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -target=aws_ecs_cluster.main -target=aws_ecs_task_definition.cli
          {
            echo "CLUSTER=$(terraform output -raw cluster_name)"
            echo "TASK_DEFINITION=$(terraform output -raw cli_task_definition)"
            echo "SUBNETS=$(terraform output -json subnet_ids | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')"
            echo "SECURITY_GROUP=$(terraform output -raw app_security_group_id)"
            echo "LOG_GROUP=${{ steps.platform.outputs.log_group_name }}"
          } >> "$GITHUB_ENV"

      - name: Run database migrations
        run: infra/scripts/run-task.sh migrate

      - name: Load hand-checked Indian alerts
        if: inputs.seed
        run: infra/scripts/run-task.sh python -m batchlight.cli seed-india

      - name: Apply app stack (web, worker, load balancer)
        working-directory: infra/terraform/app
        env:
          TF_VAR_image_tag: ${{ steps.image.outputs.tag }}
        run: |
          terraform plan -out=app.tfplan
          terraform apply app.tfplan
          {
            echo "BASE_URL=$(terraform output -raw base_url)"
            echo "ALB=$(terraform output -raw load_balancer_dns_name)"
            echo "DOMAIN=$(terraform output -raw domain_name)"
          } >> "$GITHUB_ENV"

      - name: Wait for the services to settle
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services web worker

      - name: Smoke test
        run: |
          # Connect to the load balancer directly but present the real host name, so the certificate and routing are
          # checked even before new DNS records have reached every resolver.
          get() { # get <host> <port> <url>
            curl -sS --max-time 10 --connect-to "$1:$2:${ALB}:$2" -o /dev/null -w '%{http_code} %{redirect_url}' "$3"
          }
          for path in /healthz /readyz /; do
            ok=""
            for _ in $(seq 1 12); do
              if [ -n "$DOMAIN" ]; then
                result=$(get "$DOMAIN" 443 "https://${DOMAIN}${path}" || true)
              else
                result=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "http://${ALB}${path}" || true)
              fi
              if [ "${result%% *}" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then echo "::error::${path} did not answer 200 (last: ${result:-no response})"; exit 1; fi
            echo "${path} answered 200"
          done
          if [ -n "$DOMAIN" ]; then
            want="https://${DOMAIN}/alerts?q=test"
            for check in "www.${DOMAIN} 443 https://www.${DOMAIN}/alerts?q=test" "${DOMAIN} 80 http://${DOMAIN}/alerts?q=test" "www.${DOMAIN} 80 http://www.${DOMAIN}/alerts?q=test"; do
              read -r host port url <<<"$check"
              result=$(get "$host" "$port" "$url")
              location="${result#* }"
              location="${location/:443\//\/}"
              if [ "${result%% *}" != "301" ] || [ "$location" != "$want" ]; then
                echo "::error::${url} should redirect (301) to ${want}; got: ${result}"
                exit 1
              fi
              echo "${url} redirects to ${want}"
            done
          fi

      - name: Summary
        run: |
          {
            echo "### Deployed ${{ steps.image.outputs.tag }}"
            echo "- Site: ${BASE_URL}"
            echo "- Load balancer: ${ALB}"
            echo "- Database: ${{ steps.platform.outputs.db_identifier }}"
          } >> "$GITHUB_STEP_SUMMARY"
