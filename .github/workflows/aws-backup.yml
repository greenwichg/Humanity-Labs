# Daily database snapshot, retention clean-up and a check that point-in-time recovery is current.
# Uses the narrow backup role: it can create snapshots named <project>-daily-* and delete only those it tagged.
# Manual snapshots are kept even if the database is later deleted.
name: AWS backup

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      retention_days:
        description: Delete this workflow's snapshots older than this many days
        type: number
        default: 35
      keep_min:
        description: Always keep at least this many of this workflow's newest snapshots
        type: number
        default: 7

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-backup
  cancel-in-progress: false

jobs:
  snapshot:
    if: vars.AWS_BACKUP_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      PROJECT: ${{ vars.PROJECT || 'humanity-labs' }}
      RETENTION_DAYS: ${{ inputs.retention_days || 35 }}
      KEEP_MIN: ${{ inputs.keep_min || 7 }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backup-${{ github.run_id }}

      - name: Find the databases to back up
        id: db
        run: |
          # Every instance of this project tagged backup=daily: the Terraform-managed database, plus a restored
          # database once the restore workflow has promoted it.
          aws rds describe-db-instances \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, '${PROJECT}-') && DBInstanceStatus=='available' && TagList[?Key=='backup' && Value=='daily']].DBInstanceIdentifier" \
            --output text | tr '\t' '\n' | sed '/^$/d' > databases.txt
          if [ ! -s databases.txt ]; then
            echo "::notice::No ${PROJECT} database tagged backup=daily is available (not provisioned yet, or torn down). Nothing to back up."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Backing up: $(tr '\n' ' ' < databases.txt)"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Take snapshots
        if: steps.db.outputs.found == 'true'
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          while read -r DB; do
            SNAPSHOT="${PROJECT}-daily-${DB#"${PROJECT}-"}-${stamp}"
            aws rds create-db-snapshot --db-instance-identifier "$DB" --db-snapshot-identifier "$SNAPSHOT" \
              --tags Key=created-by,Value=github-backup Key=project,Value="$PROJECT" >/dev/null
            aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAPSHOT"
            echo "### Snapshot $SNAPSHOT of $DB is available" >> "$GITHUB_STEP_SUMMARY"
          done < databases.txt

      - name: Check point-in-time recovery is current
        if: steps.db.outputs.found == 'true'
        run: |
          while read -r DB; do
            latest=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].LatestRestorableTime' --output text)
            python3 - "$DB" "$latest" <<'PY'
          import sys
          from datetime import datetime, timezone
          db, value = sys.argv[1], sys.argv[2]
          if value in ("", "None"):
              print(f"::warning::{db} has no point-in-time recovery window. Is its backup retention 0?")
              sys.exit(0)
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(value.replace("Z", "+00:00"))).total_seconds() / 3600
          print(f"{db}: point-in-time recovery is {age:.1f} hours behind")
          if age > 1:
              print(f"::warning::Point-in-time recovery of {db} is more than an hour behind. Check the RDS console.")
          PY
          done < databases.txt

      - name: Remove this workflow's old snapshots
        if: steps.db.outputs.found == 'true'
        run: |
          : > to-delete.txt
          while read -r DB; do
            aws rds describe-db-snapshots --db-instance-identifier "$DB" --snapshot-type manual \
              --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, '${PROJECT}-daily-') && Status=='available'].[DBSnapshotIdentifier,SnapshotCreateTime]" \
              --output json > snapshots.json
            python3 - <<'PY' >> to-delete.txt
          import json, os
          from datetime import datetime, timedelta, timezone
          rows = sorted(json.load(open("snapshots.json")), key=lambda r: r[1], reverse=True)
          keep_min, days = int(os.environ["KEEP_MIN"]), int(os.environ["RETENTION_DAYS"])
          cutoff = datetime.now(timezone.utc) - timedelta(days=days)
          for name, created in rows[keep_min:]:
              if datetime.fromisoformat(created.replace("Z", "+00:00")) < cutoff:
                  print(name)
          PY
          done < databases.txt
          if [ ! -s to-delete.txt ]; then echo "No snapshot is past retention."; exit 0; fi
          while read -r name; do
            echo "Deleting $name (older than ${RETENTION_DAYS} days)"
            aws rds delete-db-snapshot --db-snapshot-identifier "$name" >/dev/null
          done < to-delete.txt
