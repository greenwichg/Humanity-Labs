name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: batchlight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BATCHLIGHT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/batchlight_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check batchlight tests migrations/env.py
      - run: ruff format --check batchlight tests migrations/env.py
      - run: pytest --cov=batchlight --cov-report=term-missing
      - name: Migrations match the models
        run: BATCHLIGHT_DATABASE_URL=$BATCHLIGHT_TEST_DATABASE_URL alembic check

  stylesheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Committed stylesheet is up to date
        run: git diff --exit-code batchlight/static/app.css

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t batchlight:ci .
      # AWS runs the ARM64 (Graviton) image; build it here too so an ARM-only problem fails CI, not a deploy.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Build the ARM64 image
        run: |
          docker build --platform linux/arm64 -t batchlight:ci-arm64 .
          docker run --rm --platform linux/arm64 --entrypoint python batchlight:ci-arm64 -c "import platform, batchlight.main; print('imports fine on', platform.machine())"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate and offline plan tests (no AWS access needed)
        run: |
          for stack in bootstrap platform app; do
            terraform -chdir="infra/terraform/$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/terraform/$stack" validate
            terraform -chdir="infra/terraform/$stack" test
          done
      - name: Security scan (accepted findings are listed in infra/terraform/.checkov.yaml)
        run: pipx run checkov==3.4.3 -d infra/terraform --config-file infra/terraform/.checkov.yaml
