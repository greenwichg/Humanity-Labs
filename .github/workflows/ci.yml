name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: batchlight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BATCHLIGHT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/batchlight_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check batchlight tests migrations/env.py
      - run: ruff format --check batchlight tests migrations/env.py
      - run: pytest --cov=batchlight --cov-report=term-missing
      - name: Migrations match the models
        run: BATCHLIGHT_DATABASE_URL=$BATCHLIGHT_TEST_DATABASE_URL alembic check

  stylesheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Committed stylesheet is up to date
        run: git diff --exit-code batchlight/static/app.css

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t batchlight:ci .

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate and offline plan tests (no AWS access needed)
        run: |
          for stack in bootstrap platform app; do
            terraform -chdir="infra/terraform/$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/terraform/$stack" validate
            terraform -chdir="infra/terraform/$stack" test
          done
      - name: Security scan (accepted findings are listed in infra/terraform/.checkov.yaml)
        run: pipx run checkov==3.4.3 -d infra/terraform --config-file infra/terraform/.checkov.yaml
